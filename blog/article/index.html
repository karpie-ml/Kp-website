<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article — Blog</title>
<script>(function(){var t=localStorage.getItem("kp-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/site.css">
</head>
<body>

<nav class="ribbon">
  <a class="brand" href="../../">KP</a>
  <ul>
    <li><a href="../../">Home</a></li>
    <li><a href="../../cv/">CV</a></li>
    <li><a href="../../projects/">Projects</a></li>
    <li><a href="../" class="active">Blog</a></li>
  </ul>
  <div class="ribbon-tools">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
  <div class="ribbon-foot">&copy; Karthik Prabhu</div>
</nav>

<div class="page">
  <section class="section">
    <div class="section-inner article-inner">
      <p class="article-back"><a href="../">&larr; Back to Blog</a></p>
      <p id="article-status" class="blog-status" hidden></p>

      <article id="article" class="full-article" hidden>
        <h1 id="article-title" class="article-title"></h1>
        <p class="article-byline">
          <span id="article-author"></span>
          <span class="article-byline-sep">·</span>
          <time id="article-date"></time>
        </p>
        <img id="article-cover" class="article-cover" alt="" hidden>
        <!-- Full Medium HTML body (dangerouslySetInnerHTML equivalent) -->
        <div id="article-body" class="article-body"></div>
        <p class="article-footer">
          <a id="article-medium-link" href="#" target="_blank" rel="noopener noreferrer">Share your thoughts &rarr;</a>
        </p>
      </article>
    </div>
  </section>
</div>

<script src="../../js/theme.js"></script>
<script src="../../js/links.js"></script>
<script type="module" src="../../js/article.js"></script>
</body>
</html>
