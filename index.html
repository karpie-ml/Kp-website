<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karthik Prabhu</title>
<script>(function(){var t=localStorage.getItem("kp-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/site.css">
</head>
<body>

<nav class="ribbon">
  <a class="brand" href="./">KP</a>
  <ul>
    <li><a href="./" class="active">Home</a></li>
    <li><a href="cv/">CV</a></li>
    <li><a href="projects/">Projects</a></li>
    <li><a href="blog/">Blog</a></li>
  </ul>
  <div class="ribbon-tools">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
  <div class="ribbon-foot">&copy; Karthik Prabhu</div>
</nav>

<div class="page">

  <!-- Introduction -->
  <section class="section hero">
    <div class="section-inner">
      <img class="avatar" src="media/avatar.svg" alt="Karthik Prabhu">
      <h1 class="hero-name" id="hero-name">Hi, I am
        <span class="np">K<span class="fold">arthik&nbsp;</span></span><span class="np">P<span class="fold">rabhu</span></span>
      </h1>

      <!-- Socials: "reach me here" icon buttons, hydrated from data/home.json -->
      <div class="socials" id="socials" aria-label="Social profiles"></div>

      <div class="intro" id="about">
        <!-- hydrated from data/home.json (sanitized by the CMS at save time) -->
      </div>
    </div>
  </section>

  <!-- Education -->
  <section class="section alt">
    <div class="section-inner">
      <h2>Education</h2>
      <ul class="edu-list" id="education"></ul>
      <p class="empty-note" id="education-empty" hidden>Education entries appear here once added in the CMS.</p>
    </div>
  </section>

  <!-- Highlights -->
  <section class="section">
    <div class="section-inner">
      <h2>Highlights</h2>
      <ul class="highlight-list" id="highlights"></ul>
      <p class="empty-note" id="highlights-empty" hidden>New projects, publications and posts will appear here.</p>
    </div>
  </section>

  <!-- Contact -->
  <section class="section alt">
    <div class="section-inner">
      <h2>Contact</h2>
      <ul class="contact-list">
        <li>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          </span>
          <a id="contact-email" href="#">&mdash;</a>
        </li>
        <li>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <span id="contact-phone">&mdash;</span>
        </li>
        <li>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </span>
          <span id="contact-address">&mdash;</span>
        </li>
      </ul>
    </div>
  </section>

</div>

<script src="js/theme.js"></script>
<script src="js/home.js"></script>
</body>
</html>
